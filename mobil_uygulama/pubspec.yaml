name: mobil_uygulama
description: "Isaret Dili Tanima ve Egitim Uygulamasi"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Kamera erişimi için
  camera: ^0.10.5
  
  # İzinleri yönetmek için (Kamera vb.)
  permission_handler: ^11.3.0
  
  # Python sunucusuyla iletişim için Socket.IO
  socket_io_client: ^2.0.3+1
  
  # Görüntü işleme ve YUV -> RGB dönüşümü için
  image: ^4.1.3
  google_fonts: ^8.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/